name: Release And Publish

env:
  NODE_VERSION: 26

on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release And Publish
    runs-on: ubuntu-latest

    # contents, issues and pull-requests are what semantic-release needs for the release commit, tags,
    # the GitHub release and its comments; id-token lets npm publish through trusted publishing (OIDC),
    # which is the only npm authentication this workflow uses.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npm run release
